# העלאה אוטומטית ל-AWS Lambda בכל שינוי בענף main
# יוצר או מעדכן: תפקיד הרשאות, פונקציית Lambda, משתני סביבה, וכתובת ציבורית (Function URL)
#
# Secrets שצריך להגדיר בריפוזיטורי (Settings > Secrets and variables > Actions):
#   חיבור ל-AWS (אחת משתי האפשרויות):
#     AWS_ROLE_ARN                              אם GitHub מחובר ל-AWS דרך OIDC
#     AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY  אם משתמשים במפתחות גישה
#   הגדרות המערכת:
#     SECRET, ALLOWED_PHONES, MIKVEH_USER, MIKVEH_PASS, SYSTEM_ID
#
# Variables (לא חובה): AWS_REGION (ברירת מחדל eu-central-1)

name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_NAME: mikveh-doors
  ROLE_NAME: mikveh-doors-role
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  HAS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to AWS (OIDC role)
        if: env.HAS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to AWS (access keys)
        if: env.HAS_ROLE != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package code
        run: zip -j function.zip index.mjs

      - name: Deploy
        env:
          SECRET: ${{ secrets.SECRET }}
          ALLOWED_PHONES: ${{ secrets.ALLOWED_PHONES }}
          MIKVEH_USER: ${{ secrets.MIKVEH_USER }}
          MIKVEH_PASS: ${{ secrets.MIKVEH_PASS }}
          SYSTEM_ID: ${{ secrets.SYSTEM_ID }}
        run: |
          set -euo pipefail

          # משתני הסביבה של הלמדה (ערכים ריקים לא נשלחים)
          ENV_JSON=$(jq -cn \
            --arg SECRET "$SECRET" \
            --arg ALLOWED_PHONES "$ALLOWED_PHONES" \
            --arg MIKVEH_USER "$MIKVEH_USER" \
            --arg MIKVEH_PASS "$MIKVEH_PASS" \
            --arg SYSTEM_ID "$SYSTEM_ID" \
            '{Variables: ({SECRET:$SECRET, ALLOWED_PHONES:$ALLOWED_PHONES, MIKVEH_USER:$MIKVEH_USER, MIKVEH_PASS:$MIKVEH_PASS, SYSTEM_ID:$SYSTEM_ID} | with_entries(select(.value != "")))}')

          # 1. תפקיד הרשאות לפונקציה
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "Creating IAM role"
            aws iam create-role --role-name "$ROLE_NAME" \
              --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' >/dev/null
            aws iam attach-role-policy --role-name "$ROLE_NAME" \
              --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          fi
          ROLE_ARN=$(aws iam get-role --role-name "$ROLE_NAME" --query Role.Arn --output text)

          # 2. הפונקציה עצמה
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Updating function"
            aws lambda update-function-code --function-name "$FUNCTION_NAME" \
              --zip-file fileb://function.zip >/dev/null
            aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
            aws lambda update-function-configuration --function-name "$FUNCTION_NAME" \
              --runtime nodejs22.x --handler index.handler --timeout 15 --memory-size 128 \
              --environment "$ENV_JSON" >/dev/null
          else
            echo "Creating function"
            # תפקיד חדש לוקח כמה שניות להיות זמין, לכן מנסים כמה פעמים
            for i in 1 2 3 4 5 6; do
              if aws lambda create-function --function-name "$FUNCTION_NAME" \
                  --runtime nodejs22.x --handler index.handler --timeout 15 --memory-size 128 \
                  --role "$ROLE_ARN" --zip-file fileb://function.zip \
                  --environment "$ENV_JSON" >/dev/null; then
                break
              fi
              if [ "$i" = 6 ]; then exit 1; fi
              echo "Role not ready yet, retrying in 10s"; sleep 10
            done
          fi
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"

          # 3. כתובת ציבורית + הרשאות גישה אליה
          if ! aws lambda get-function-url-config --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Creating function URL"
            aws lambda create-function-url-config --function-name "$FUNCTION_NAME" \
              --auth-type NONE >/dev/null
          fi
          aws lambda add-permission --function-name "$FUNCTION_NAME" \
            --statement-id FunctionUrlPublicAccess --action lambda:InvokeFunctionUrl \
            --principal '*' --function-url-auth-type NONE >/dev/null 2>&1 || true
          aws lambda add-permission --function-name "$FUNCTION_NAME" \
            --statement-id FunctionUrlInvokeFunction --action lambda:InvokeFunction \
            --principal '*' --invoked-via-function-url >/dev/null 2>&1 || true

          URL=$(aws lambda get-function-url-config --function-name "$FUNCTION_NAME" \
            --query FunctionUrl --output text)
          echo "Function URL: $URL"
          {
            echo "## ✅ הלמדה עלתה"
            echo ""
            echo "כתובת הפונקציה:"
            echo ""
            echo "\`$URL\`"
            echo ""
            echo "ב-ext.ini של ימות המשיח:"
            echo ""
            echo '```'
            echo "type=api"
            echo "api_link=${URL}?key=<SECRET שלך>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
